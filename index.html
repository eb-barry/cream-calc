<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>面霜配方重量計算器</title>

  <style>
    body {
      font-family: "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
      margin: 20px;
      line-height: 1.6;
    }

    h2 {
      margin-bottom: 20px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 12px;
    }

    select,
    input,
    button {
      font-size: 16px;
      padding: 8px;
      margin-top: 6px;
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
    }

    button {
      margin-top: 14px;
      cursor: pointer;
    }

    .button-row {
      max-width: 420px;
    }

    table {
      border-collapse: collapse;
      margin-top: 24px;
      width: 100%;
      max-width: 720px;
      font-size: 16px;
    }

    th,
    td {
      border: 1px solid #555;
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: #f2f2f2;
    }

    td:first-child {
      text-align: left;
    }

    .note {
      margin-top: 12px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>

  <h2>面霜配方重量計算器</h2>

  <label for="type">選擇面霜類型：</label>
  <select id="type">
    <option value="rich">滋潤型</option>
    <option value="light">清爽型</option>
  </select>

  <label for="total">面霜總量（公克）：</label>
  <input
    type="number"
    id="total"
    step="0.01"
    min="0"
    placeholder="例如：1000"
  >

  <div class="button-row">
    <button type="button" onclick="calculate()">計算原料重量</button>
    <button type="button" onclick="clearData()">清除儲存資料</button>
  </div>

  <div class="note">
    系統會自動儲存上次輸入的面霜類型、總量與計算結果。
  </div>

  <table id="result"></table>

  <script>
    const STORAGE_KEY = "creamFormulaCalculator";

    const formulas = {
      rich: [
        ["玫瑰純露", 68.7],
        ["甘油", 2],
        ["1,3-丙二醇", 3],
        ["菸鹼醯胺（B3）", 2.5],
        ["泛醇（維生素 B5）", 1],
        ["中藥浸泡荷荷芭油", 10],
        ["角鯊烷（Squalane）", 5],
        ["橄欖乳化蠟", 5],
        ["大豆卵磷脂", 1],
        ["維他命 E", 1],
        ["苯氧乙醇", 0.6],
        ["玫瑰精油", 0.2]
      ],
      light: [
        ["玫瑰純露", 71.8],
        ["甘油", 2],
        ["1,3-丙二醇", 3],
        ["菸鹼醯胺（B3）", 2.5],
        ["泛醇（維生素 B5）", 1],
        ["中藥浸泡荷荷芭油", 10],
        ["角鯊烷（Squalane）", 4],
        ["橄欖乳化蠟", 3.5],
        ["大豆卵磷脂", 0.8],
        ["維他命 E", 0.7],
        ["苯氧乙醇", 0.6],
        ["玫瑰精油", 0.1]
      ]
    };

    function calculate() {
      const total = parseFloat(document.getElementById("total").value);
      const type = document.getElementById("type").value;

      if (isNaN(total) || total <= 0) {
        alert("請輸入正確的面霜總量（公克）");
        return;
      }

      const formula = formulas[type];
      const table = document.getElementById("result");

      table.innerHTML = `
        <tr>
          <th>原料名稱</th>
          <th>比例（%）</th>
          <th>重量（g）</th>
        </tr>
      `;

      formula.forEach(function(item) {
        const name = item[0];
        const percent = item[1];
        const weight = (total * percent / 100).toFixed(2);

        table.innerHTML += `
          <tr>
            <td>${name}</td>
            <td>${percent}</td>
            <td>${weight}</td>
          </tr>
        `;
      });

      saveData();
    }

    function saveData() {
      const data = {
        creamType: document.getElementById("type").value,
        totalWeight: document.getElementById("total").value,
        resultHTML: document.getElementById("result").innerHTML
      };

      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);

      if (!saved) {
        return;
      }

      try {
        const data = JSON.parse(saved);

        document.getElementById("type").value = data.creamType || "rich";
        document.getElementById("total").value = data.totalWeight || "";

        if (data.resultHTML) {
          document.getElementById("result").innerHTML = data.resultHTML;
        }
      } catch (error) {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    function clearData() {
      localStorage.removeItem(STORAGE_KEY);

      document.getElementById("type").value = "rich";
      document.getElementById("total").value = "";
      document.getElementById("result").innerHTML = "";
    }

    document.addEventListener("DOMContentLoaded", function() {
      loadData();

      document.getElementById("type").addEventListener("change", function() {
        saveData();
      });

      document.getElementById("total").addEventListener("input", function() {
        saveData();
      });
    });
  </script>

</body>
</html>
